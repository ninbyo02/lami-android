// Resolve the exact stdlib selected by the app; do not guess from cache contents.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('writeTokenizerCiClasspath') {
        doLast {
            def stdlib = app.configurations.getByName('standardDebugRuntimeClasspath')
                .incoming.artifactView { view ->
                    view.componentFilter { id ->
                        id instanceof ModuleComponentIdentifier &&
                            id.group == 'org.jetbrains.kotlin' && id.module == 'kotlin-stdlib'
                    }
                }.files.singleFile
            def output = new File(app.property('tokenizerCiClasspathOutput').toString())
            output.parentFile.mkdirs()
            output.text = stdlib.absolutePath + '\n'
        }
    }
}

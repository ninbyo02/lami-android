name: Android CI

on:
  pull_request:
    branches:
      - main
      - future
      - stable
  push:
    branches:
      - main
      - future
      - stable
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'codex/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard-debug:
    name: Standard debug unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run standard debug unit tests
        run: ./gradlew --no-daemon :app:testStandardDebugUnitTest --stacktrace -PbuildPr=${{ github.event_name == 'pull_request' && github.event.number || '' }}

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lami-standard-debug-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

name: Android CI

on:
  pull_request:
    branches:
      - main
      - stable
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'codex/**'
      - 'ci/**'
  push:
    branches:
      - main
      - stable
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'codex/**'
      - 'ci/**'
  workflow_dispatch:

jobs:
  standard-debug:
    name: Standard debug build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.1.13356709"
          yes | sdkmanager --licenses

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run standard debug unit tests
        run: ./gradlew --no-daemon :app:testStandardDebugUnitTest --stacktrace -PbuildPr=${{ github.event_name == 'pull_request' && github.event.number || '' }}

      - name: Build standard debug APK
        run: ./gradlew --no-daemon :app:assembleStandardDebug --stacktrace -PbuildPr=${{ github.event_name == 'pull_request' && github.event.number || '' }}

      - name: Upload standard debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lami-standard-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lami-standard-debug-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
